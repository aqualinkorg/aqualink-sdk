name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install urllib3 python-dateutil flake8

      - name: Compile
        run: python -m compileall -q sdk/aqualink_sdk

      - name: Import
        run: |
          PYTHONPATH=sdk python -c "import aqualink_sdk; c = aqualink_sdk.Configuration(); print(aqualink_sdk.__version__, c.host)"

      - name: Lint custom files
        run: flake8 --max-line-length=99 sdk/aqualink_sdk/api/aggregate_api.py sdk/test_aqualink_sdk.py
